version: 2

# Workflow actions are pinned to commit SHAs (see .github/workflows/*.yml). Dependabot
# reads the `# vX.Y.Z` comment next to each pin, so it can still raise a PR bumping the
# SHA *and* the comment when a new release lands — the pins stay current instead of
# freezing.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
