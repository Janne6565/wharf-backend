name: Docker

# Merge to main IS the prod deploy: build + push the image, then bump the pinned
# tag in wharf-deployment/overlays/main. ArgoCD reconciles the commit onto the cluster.
on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/janne6565/wharf-backend
  DEPLOY_REPO: Janne6565/wharf-deployment
  OVERLAY_PATH: overlays/main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute immutable image tag
        id: meta
        run: echo "tag=main-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Separate job so a missing/invalid DEPLOY_REPO_SSH_KEY fails ONLY the tag bump —
  # the image is already built and pushed above. The secret is the private half of a
  # write deploy key on wharf-deployment (repo-scoped, unlike a PAT).
  bump-deployment:
    needs: build-and-push
    runs-on: ubuntu-latest
    # This job authenticates to wharf-deployment with the SSH deploy key only — it
    # never touches the GITHUB_TOKEN, so it gets no scopes at all.
    permissions: {}
    steps:
      - name: Check out wharf-deployment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DEPLOY_REPO }}
          ssh-key: ${{ secrets.DEPLOY_REPO_SSH_KEY }}

      # Deliberately NOT a third-party action: the deploy key is already on disk and
      # wired into core.sshCommand for this whole job, so anything that runs here can
      # read it. This installs the same binary imranismail/setup-kustomize resolved to
      # (its default version spec `*` = latest release), straight from the official
      # kubernetes-sigs release, verified against the published checksum.
      - name: Install kustomize
        env:
          KUSTOMIZE_VERSION: v5.8.1
          # sha256 of kustomize_v5.8.1_linux_amd64.tar.gz from the release checksums.txt
          KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kustomize-bin"
          curl -fsSL -o "$RUNNER_TEMP/kustomize.tar.gz" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  $RUNNER_TEMP/kustomize.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP/kustomize-bin" kustomize
          echo "$RUNNER_TEMP/kustomize-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/kustomize-bin/kustomize" version

      # Backend and web bumps can land concurrently on the same repo — on a rejected
      # push, reset to the remote head and re-apply the pin instead of failing.
      - name: Pin backend image to the immutable tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            (cd ${{ env.OVERLAY_PATH }} && kustomize edit set image ${{ env.IMAGE }}=${{ env.IMAGE }}:${{ needs.build-and-push.outputs.tag }})
            git add ${{ env.OVERLAY_PATH }}/kustomization.yaml
            if git diff --cached --quiet; then
              echo "No image change to commit."
              exit 0
            fi
            git commit -m "ci: update backend image to ${{ needs.build-and-push.outputs.tag }}"
            if git push; then
              exit 0
            fi
            echo "Push rejected (concurrent bump) — retrying on latest main ($attempt/5)."
            git fetch origin main
            git reset --hard origin/main
          done
          echo "Failed to push the image bump after 5 attempts." >&2
          exit 1
