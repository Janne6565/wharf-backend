spring.application.name=wharf-backend
spring.profiles.active=dev

# --- Persistence -------------------------------------------------------------
# Schema is owned by Flyway; never let Hibernate touch DDL outside of local dev.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- JWT ---------------------------------------------------------------------
# The secret MUST be overridden in every non-local environment via JWT_SECRET_KEY.
# The value below is an insecure development fallback only (documented in README).
jwt.secret-key=${JWT_SECRET_KEY:dev-only-insecure-secret-change-me-0123456789abcdef}
jwt.identity-expiration=PT15M
jwt.refresh-expiration=P30D
jwt.issuer=wharf-backend

# --- Refresh cookie ----------------------------------------------------------
auth.cookie.name=wharf_refresh
auth.cookie.secure=true
auth.cookie.same-site=Strict
auth.cookie.path=/api/v1/auth

# --- Vault -------------------------------------------------------------------
# Server never parses the blob; it only enforces a hard size ceiling.
vault.max-size-bytes=1048576

# --- Projects (team workspaces) ----------------------------------------------
# How long a project invite stays valid before it is treated as expired
# (ISO-8601 duration; default 14 days).
wharf.projects.invite-ttl=P14D

# --- Request body limits -----------------------------------------------------
# Global ceiling on request bodies (~1.5 MiB), leaving headroom over the base64
# vault cap so an oversized payload is bounded at the container before it reaches
# the app. The per-field @Size + VaultService checks are the authoritative guards.
server.tomcat.max-http-form-post-size=1572864
server.tomcat.max-swallow-size=1572864

# --- Device codes ------------------------------------------------------------
device-code.ttl=PT10M

# --- CORS --------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173

# --- Rate limiting (Bucket4j, per client IP) ---------------------------------
rate-limit.enabled=true
# Trust X-Forwarded-For only behind a proxy that overwrites it (see application-prod).
rate-limit.trust-forwarded-header=false
rate-limit.auth-capacity=20
rate-limit.auth-refill-period=PT1M
rate-limit.recovery-capacity=5
rate-limit.recovery-refill-period=PT1M
# Email verification (POST /api/v1/auth/verify-email, /auth/resend-verification): the code is
# only 6 digits, and a resend triggers outbound mail — keep this bucket tight.
rate-limit.verify-capacity=5
rate-limit.verify-refill-period=PT1M
# Invite creation (POST /api/v1/projects/{id}/invites): each can trigger an outbound email.
rate-limit.invite-capacity=20
rate-limit.invite-refill-period=PT1H

# --- OAuth social login ------------------------------------------------------
# OAuth links an external identity to a local account, then the app issues its own JWTs.
# NO SECRETS IN GIT: client id/secret default to empty; a provider is disabled until both
# are supplied. public-base-url builds the provider redirect_uri
# <public-base-url>/api/v1/auth/oauth/{provider}/callback (prod sets https://wharf.jannekeipert.de).
oauth.public-base-url=${OAUTH_PUBLIC_BASE_URL:http://localhost:8080}
# Server-controlled deep-link base a mobile-initiated login is handed back through
# (?code=<device-code> on success, ?error=<code> on failure). Never caller-supplied.
oauth.mobile-redirect-uri=${OAUTH_MOBILE_REDIRECT_URI:wharf://oauth}
oauth.google.client-id=${OAUTH_GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET:}
oauth.github.client-id=${OAUTH_GITHUB_CLIENT_ID:}
oauth.github.client-secret=${OAUTH_GITHUB_CLIENT_SECRET:}

# --- Mail notifications ------------------------------------------------------
# Outbound transactional email via the external Mail Manager service. NO SECRET IN GIT:
# the API key defaults to empty and mail delivery is disabled (a no-op client is wired in)
# until MAIL_SERVICE_API_KEY is supplied. Key format mk_<uuid>_<secret>, scope SEND.
wharf.mail.base-url=https://mail-service.jannekeipert.de
wharf.mail.api-key=${MAIL_SERVICE_API_KEY:}
# Origin every link in an email is built from, and the domain shown in the footer. Mail links
# must be absolute and must point at the deployment that sent them, so this is configured per
# environment (prod overrides it to the public host).
wharf.mail.app-base-url=${WHARF_APP_BASE_URL:http://localhost:5173}
wharf.mail.sending-domain=${WHARF_SENDING_DOMAIN:wharf.jannekeipert.de}

# --- Actuator / metrics ------------------------------------------------------
# Health for the k8s probes, Prometheus for the in-cluster Grafana Alloy scrape. Both stay
# on the app port: Traefik only routes /api to the backend, so /actuator is never public.
management.endpoints.web.exposure.include=health,prometheus
# Expose /actuator/health/{liveness,readiness} for Kubernetes probes.
management.endpoint.health.probes.enabled=true
# Stamp every meter with the app name so the shared Grafana Cloud stack can tell services apart.
management.metrics.tags.application=${spring.application.name}
# The whole cluster shares Grafana Cloud's free tier of 10,000 active series, and this service
# gets at most ~200 of them. Hence client-side percentiles, NOT a bucket histogram: a histogram
# ships one series per bucket per URI per status, and Alloy drops every *_bucket anyway.
# Only 0.95 and 0.99: with ~40 route templates every extra quantile costs a series per
# URI x status. The trade-off: percentiles are computed inside this JVM, so they cannot be
# re-aggregated across replicas and a quantile not listed here cannot be recovered later. Fine
# at one replica; revisit before scaling out.
management.metrics.distribution.percentiles-histogram.http.server.requests=false
management.metrics.distribution.percentiles.http.server.requests=0.95,0.99
# Meter families nobody reads, cut for the series budget. Keys match by prefix.
management.metrics.enable.spring.security=false
management.metrics.enable.spring.data.repository=false
management.metrics.enable.tomcat.sessions=false
management.metrics.enable.jvm.buffer=false
management.metrics.enable.jvm.classes=false
management.metrics.enable.jvm.compilation=false
management.metrics.enable.executor=false
management.metrics.enable.tasks.scheduled=false
management.metrics.enable.application.started.time=false
management.metrics.enable.application.ready.time=false
management.metrics.enable.http.server.requests.active=false
management.metrics.enable.process.files=false

# --- OpenAPI -----------------------------------------------------------------
# springdoc 3 emits OpenAPI 3.1 by default, which renders optional fields as
# type: ["string","null"] instead of nullable: true. The committed openapi.json and the
# Orval clients in wharf-web / wharf-mobile are generated against 3.0.1, so pin the
# emitted version and keep the published contract unchanged.
springdoc.api-docs.version=openapi_3_0
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
